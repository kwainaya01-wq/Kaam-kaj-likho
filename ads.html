<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing PDF...</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f4f4; }
        .ad-box { width: 300px; min-height: 250px; background: #ddd; margin: 20px auto; border: 1px solid #ccc; display: flex; align-items: center; justify-content: center; }
        .btn { padding: 15px 30px; font-size: 18px; color: white; background-color: #28a745; border: none; border-radius: 5px; cursor: pointer; display: none; text-decoration: none; }
    </style>
</head>
<body>
    <h2>Aapka PDF taiyar ho raha hai...</h2>
    <p id="timer">Kripya 10 second intezar karein.</p>

    <!-- ADSTERRA CODE START (Ismein aapka code laga hua hai) -->
    <div class="ad-box">
        <script async="async" data-cfasync="false" src="https://pl29326737.profitablecpmratenetwork.com/aa7bbe8298d797fb3ead79711aede1d9d/invoke.js"></script>
        <div id="container-aa7bbe8298d797fb3ead79711aede1d9d"></div>
    </div>
    <!-- ADSTERRA CODE END -->

    <button id="downloadBtn" class="btn" onclick="startDownload()">PDF Download Karein</button>

    <script>
        let count = 10;
        let timer = setInterval(function() {
            count--;
            document.getElementById('timer').innerText = "Kripya " + count + " second intezar karein.";
            if (count <= 0) {
                clearInterval(timer);
                document.getElementById('timer').style.display = "none";
                document.getElementById('downloadBtn').style.display = "inline-block";
            }
        }, 1000);

        function startDownload() {
            const urlParams = new URLSearchParams(window.location.search);
            const fileUrl = urlParams.get('file');
            if (fileUrl) {
                // decodeURIComponent PDF link ko sahi se kholne mein madad karega
                window.location.href = decodeURIComponent(fileUrl);
            } else {
                alert("Download link nahi mila!");
            }
        }
    </script>
</body>
</html>
