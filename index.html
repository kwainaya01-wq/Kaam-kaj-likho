<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaam Kaj Likho by wahid</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div class="app-card">
        <div id="authSection">
            <h2 id="authTitle">Login</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button class="main-btn" id="mainAuthBtn">Login</button>
            <p id="authStatus" style="display:none; text-align:center; color:blue;">Thoda ruko...</p>
            <p style="text-align:center; margin-top:10px;">
                <span id="toggleBtn" style="color:blue; cursor:pointer;">Sign Up Karein</span>
            </p>
        </div>

        <div id="appContent" style="display:none;">
            <div class="header-row">
                <span id="userEmail">User</span>
                <button id="logoutBtn" class="logout-btn">Logout</button>
            </div>

            <div class="summary-cards">
                <div class="card-mini" style="background:#e3f2fd;">
                    <small>Total Duty</small><br><strong id="totalDutyDisplay">0h</strong>
                </div>
                <div class="card-mini" style="background:#fff3e0;">
                    <small>Total OT</small><br><strong id="totalOTDisplay">0h</strong>
                </div>
            </div>
            
            <div class="form">
                <input type="text" id="nameInput" placeholder="Worker Name">
                <input type="date" id="dateInput">
                <div class="row">
                    <div class="col"><label>Duty</label><input type="number" id="hrsInput" value="8"></div>
                    <div class="col"><label>OT</label><input type="number" id="otInput" value="0"></div>
                </div>
                <button id="saveBtn" class="main-btn">Kaam Save Karo</button>
            </div>

            <div class="list-container">
                <h3>Saved Records</h3>
                <input type="text" id="dashboardSearch" onkeyup="searchWorker(this.value)" 
                placeholder="🔍 Worker dhoondhein..." 
                style="width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #2ecc71; border-radius: 10px; box-sizing: border-box; outline: none; font-size: 16px;">
                <div id="entryList">Data load ho raha hai...</div>
            </div>
        </div>
    </div>

    <div id="customAlert" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center;">
        <div style="background:white; padding:20px; border-radius:10px; width:85%; max-width:320px; text-align:center; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
            <p id="alertMessage" style="color:#333; font-weight:bold; margin-bottom:20px; font-family: sans-serif; line-height: 1.5;"></p>
            <div style="display: flex; gap: 10px;">
                <button id="cancelBtn" onclick="closeAlert()" style="display:none; background:#f1f1f1; color:#333; border:1px solid #ccc; padding:12px; border-radius:5px; flex:1; font-weight:bold;">Cancel</button>
                <button id="okBtn" style="background:#28a745; color:white; border:none; padding:12px; border-radius:5px; flex:1; font-weight:bold;">OK</button>
            </div>
        </div>
    </div>

    <script>
    function searchWorker(name) {
      var filter, container, cards, i, txtValue, cardTitle;
      filter = name.toUpperCase();
      container = document.getElementById("entryList");
      cards = container.children; 
      for (i = 0; i < cards.length; i++) {
        cardTitle = cards[i].querySelector("strong, h3, b") || cards[i];
        if (cardTitle) {
          txtValue = cardTitle.textContent || cardTitle.innerText;
          if (txtValue.toUpperCase().indexOf(filter) > -1) {
            cards[i].style.display = "flex";
          } else {
            cards[i].style.display = "none";
          }
        }
      }
    }
    </script>
    <script type="module" src="script.js"></script>
</body>
</html>
